eSQL Serverless v2</text><text x="98" y="878" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Verified TLS / TCP 5432 · app security group source</text><text x="98" y="901" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">One writer · 0.5–4 ACU · no reader</text><rect x="710" y="820" width="245" height="105" rx="8" fill="#ffffff" stroke="#b4cad8" stroke-width="1.5"/><text x="728" y="851" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0e5960" font-weight="700">NAT egress</text><text x="728" y="878" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Application subnet egress</text><text x="728" y="901" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">DB tier: no default route</text><rect x="1020" y="310" width="320" height="95" rx="8" fill="#ffffff" stroke="#b4cad8" stroke-width="1.5"/><text x="1038" y="341" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0e5960" font-weight="700">AWS Secrets Manager</text><text x="1038" y="368" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Scoped secret ARNs</text><text x="1038" y="391" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">No secret values in source</text><rect x="1020" y="475" width="320" height="95" rx="8" fill="#ffffff" stroke="#b4cad8" stroke-width="1.5"/><text x="1038" y="506" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0e5960" font-weight="700">Amazon ECR</text><text x="1038" y="533" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Immutable image digest</text><text x="1038" y="556" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Node identity pulls image</text><rect x="1020" y="640" width="320" height="95" rx="8" fill="#ffffff" stroke="#b4cad8" stroke-width="1.5"/><text x="1038" y="671" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0e5960" font-weight="700">EKS control plane</text><text x="1038" y="698" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">AWS-managed service</text><text x="1038" y="721" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Separate restricted admin path</text><rect x="1020" y="820" width="320" height="105" rx="8" fill="#ffffff" stroke="#b4cad8" stroke-width="1.5"/><text x="1038" y="851" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0e5960" font-weight="700">Deployment ownership</text><text x="1038" y="878" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Terraform / Helm / operator</text><text x="1038" y="901" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">S3 state + native lockfiles</text><text x="40" y="1035" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#37546b" font-weight="400">Solid arrows: request/data path. Dashed arrows: identity, reconciliation, egress or deployment relationships.</text><text x="40" y="1070" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#37546b" font-weight="400">POC limits: one worker/writer, fixture provider, WAF COUNT, optional NetworkPolicy off; no HA/compliance claim.</text></svg>
