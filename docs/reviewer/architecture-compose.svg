<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-label="Local Docker Compose architecture"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#375c72"/></marker></defs><rect width="100%" height="100%" fill="#f6f9fc"/><text x="40" y="55" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#102a43" font-weight="700">Local Docker Compose architecture</text><text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#37546b" font-weight="400">Portable API demonstration | no AWS credentials required</text><rect x="300" y="130" width="940" height="610" rx="12" fill="#eaf2f8" stroke="#9eb6c6" stroke-width="1.5" stroke-dasharray="6 4"/><text x="318" y="158" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#37546b" font-weight="700">COMPOSE NETWORK</text><path d="M260 290 H350" fill="none" stroke="#375c72" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 290 H850" fill="none" stroke="#375c72" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 355 V485" fill="none" stroke="#375c72" stroke-width="2" marker-end="url(#arrow)"/><path d="M850 535 H690" fill="none" stroke="#375c72" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><path d="M1020 485 V390 H650 V355" fill="none" stroke="#375c72" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="42" y="235" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#37546b" font-weight="700">Host: localhost</text><rect x="40" y="250" width="220" height="110" rx="8" fill="#ffffff" stroke="#b4cad8" stroke-width="1.5"/><text x="58" y="281" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0e5960" font-weight="700">Reviewer client</text><text x="58" y="308" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Swagger / curl</text><text x="58" y="331" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Smoke / benchmark</text><rect x="350" y="240" width="340" height="115" rx="8" fill="#ffffff" stroke="#b4cad8" stroke-width="1.5"/><text x="368" y="271" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0e5960" font-weight="700">FastAPI API</text><text x="368" y="298" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">HTTP :8000 (loopback)</text><text x="368" y="321" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Service + provider + repository</text><text x="706" y="270" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#37546b" font-weight="400">provider HTTP</text><rect x="850" y="240" width="340" height="105" rx="8" fill="#ffffff" stroke="#b4cad8" stroke-width="1.5"/><text x="868" y="271" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0e5960" font-weight="700">Provider stub</text><text x="868" y="298" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Fixture contract only</text><text x="868" y="321" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">No published host port</text><text x="535" y="415" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">asyncpg / SQLAlchemy</text><rect x="350" y="485" width="340" height="105" rx="8" fill="#ffffff" stroke="#b4cad8" stroke-width="1.5"/><text x="368" y="516" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0e5960" font-weight="700">PostgreSQL 16</text><text x="368" y="543" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Exact NUMERIC amounts</text><text x="368" y="566" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Intent + execution outcomes</text><rect x="850" y="485" width="340" height="105" rx="8" fill="#ffffff" stroke="#b4cad8" stroke-width="1.5"/><text x="868" y="516" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0e5960" font-weight="700">Alembic migration</text><text x="868" y="543" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">One-shot schema upgrade</text><text x="868" y="566" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Success gates API startup</text><text x="718" y="520" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#37546b" font-weight="400">schema</text><text x="850" y="675" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#37546b" font-weight="700">API startup gates:</text><text x="850" y="704" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Migrated DB + healthy provider</text><rect x="350" y="650" width="340" height="70" rx="8" fill="#ffffff" stroke="#b4cad8" stroke-width="1.5"/><text x="368" y="681" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0e5960" font-weight="700">spin_local_pg volume</text><text x="368" y="708" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#37546b" font-weight="400">Persists local demo records</text><path d="M520 590 V650" fill="none" stroke="#375c72" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="785" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#37546b" font-weight="400">POST: validate → store PENDING → call provider once → store result. GET: query persisted results.</text><text x="40" y="820" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#37546b" font-weight="400">Provider owns balances/locks. Timeout or crash may leave UNKNOWN/PENDING; no blind retries.</text></svg>
