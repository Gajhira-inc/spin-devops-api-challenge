# Local development only. Never reuse these demonstration DB credentials in AWS.
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: spin_local
      POSTGRES_PASSWORD: spin_local
      POSTGRES_DB: spin
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U spin_local -d spin"]
      interval: 2s
      retries: 20
    volumes: [spin_local_pg:/var/lib/postgresql/data]
  migrate:
    build: ./fastAPI
    image: spin-api:local
    command: [alembic, upgrade, head]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://spin_local:spin_local@postgres:5432/spin
      DB_SSLMODE: disable
    depends_on:
      postgres: {condition: service_healthy}
  provider:
    image: spin-api:local
    build: ./fastAPI
    command: [uvicorn, "provider_mock.main:app", --host, 0.0.0.0, --port, "8000", --no-access-log]
    environment:
      MOCK_SCENARIO: ${MOCK_SCENARIO:-approved}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 2s
      retries: 20
  api:
    image: spin-api:local
    build: ./fastAPI
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://spin_local:spin_local@postgres:5432/spin
      DB_SSLMODE: disable
      PROVIDER_BASE_URL: http://provider:8000
      PROVIDER_ALLOW_HTTP: "true"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      provider: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  spin_local_pg:
